<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Map Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 16px;
            color: #202124;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 16px;
            height: calc(100vh - 32px);
        }

        .sidebar {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-title-block {
            margin-bottom: 20px;
            border-bottom: 1px solid #dadce0;
            padding-bottom: 16px;
        }

        .trip-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .trip-title-row .plane-icon {
            font-size: 1.4em;
            flex-shrink: 0;
        }

        .trip-title-input {
            flex: 1;
            font-size: 1.35em;
            font-weight: 500;
            color: #202124;
            font-family: inherit;
            border: none;
            border-bottom: 2px solid #dadce0;
            padding: 6px 4px;
            background: transparent;
            min-width: 0;
        }

        .trip-title-input:focus {
            outline: none;
            border-bottom-color: #4285f4;
        }

        .section h3 .count-pill {
            display: inline-block;
            margin-left: 6px;
            padding: 4px 12px;
            font-size: 0.75em;
            font-weight: 500;
            letter-spacing: 0;
            text-transform: none;
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            vertical-align: middle;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h3 {
            color: #202124;
            font-size: 0.95em;
            margin-bottom: 12px;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 500;
        }

        .country-select {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .selected-countries-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            min-height: 30px;
            padding: 8px;
            background: #e8f0fe;
            border-radius: 4px;
            border: 1px solid #d2e3fc;
        }

        .country-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85em;
            font-weight: 500;
            color: white;
            background: #1a73e8;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,.3);
        }

        .country-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .country-tag button:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #1a73e8;
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 0.9em;
            color: #202124;
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85em;
            color: #5f6368;
            font-weight: 500;
        }

        .input-group input,
        .input-group select {
            padding: 10px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: inherit;
            color: #202124;
            background: white;
            transition: all 0.2s ease;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 1px 3px 0 rgba(26,115,232,.3);
        }

        button {
            padding: 10px 16px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #1765cc;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
        }

        .btn-danger {
            background: #d33b27;
        }

        .btn-danger:hover {
            background: #ba3824;
        }

        .btn-secondary {
            background: #5f6368;
        }

        .btn-secondary:hover {
            background: #4a4f55;
        }

        .accommodation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .accommodation-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #1a73e8;
        }

        .accommodation-item h4 {
            font-size: 0.9em;
            color: #202124;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .accommodation-item p {
            font-size: 0.85em;
            color: #5f6368;
            margin: 2px 0;
        }

        .city-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .city-item {
            background: #e8f0fe;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #202124;
            border-left: 3px solid #1a73e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .city-item button {
            padding: 3px 8px;
            font-size: 0.75em;
            background: #d33b27;
        }

        .map-container {
            position: relative;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
        }

        .map-container:fullscreen,
        .map-container:-webkit-full-screen {
            border-radius: 0;
            width: 100%;
            height: 100%;
            max-height: 100%;
        }

        .map-fullscreen-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.95);
            color: #5f6368;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .map-fullscreen-toggle:hover {
            background: white;
            color: #1a73e8;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
        }

        .map-fullscreen-toggle:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .info-box {
            background: #fef7e0;
            border-left: 4px solid #fbbc04;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #5f6368;
            margin-bottom: 15px;
        }

        .legend {
            background: rgba(255, 255, 255, 0.98);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.85em;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,.3);
        }

        .legend-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            cursor: pointer;
            color: #202124;
        }

        .legend-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            padding: 0;
            color: #5f6368;
            display: flex;
            align-items: center;
        }

        .legend-toggle-btn:hover {
            color: #1a73e8;
        }

        .legend-content {
            display: none;
        }

        .legend-content.expanded {
            display: block;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #202124;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 2px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 6px 0 rgba(60,64,67,.2), 0 12px 16px 4px rgba(60,64,67,.2);
        }

        .modal-content h3 {
            color: #202124;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #9aa0a6;
            cursor: pointer;
            line-height: 20px;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: #202124;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
        }

        @media (max-width: 1024px) {
            body {
                padding: 8px;
            }

            .container {
                display: flex;
                flex-direction: column;
                gap: 8px;
                height: auto;
            }

            .sidebar {
                flex: 0 0 auto;
                max-height: 350px;
                padding: 16px;
            }

            .map-container {
                height: 500px;
                border-radius: 8px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            .container {
                display: flex;
                flex-direction: column;
                gap: 8px;
                height: auto;
            }

            .sidebar {
                flex: 0 0 auto;
                max-height: 350px;
                border-radius: 8px;
                padding: 16px;
            }

            .map-container {
                height: 400px;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-title-block">
                <div class="trip-title-row">
                    <span class="plane-icon" aria-hidden="true">✈️</span>
                    <input type="text" id="tripTitleInput" class="trip-title-input" value="Travel Map" maxlength="120" placeholder="Trip name" aria-label="Trip map title" oninput="onTripTitleInput()">
                </div>
            </div>

            <div class="info-box">
                Select countries, add accommodations, and mark visited cities to visualize your travels!
            </div>

            <!-- Country Selection -->
            <div class="section">
                <h3>🌍 Countries visited <span id="hdrCountriesCount" class="count-pill">0</span></h3>
                <div class="input-group">
                    <input type="text" id="countrySearch" placeholder="Search countries..." onkeyup="filterCountries()">
                </div>
                <div id="selectedCountriesTags" class="selected-countries-tags"></div>
                <div class="country-select" id="countrySelect"></div>
            </div>

            <!-- Country Color Customization -->
            <div class="section">
                <h3>🎨 Customize Colors</h3>
                <div class="input-group">
                    <label for="colorCountrySelect">Select Country</label>
                    <select id="colorCountrySelect" onchange="updateColorPicker()">
                        <option value="">Choose a country...</option>
                    </select>
                </div>
                <div class="input-group" id="colorPickerGroup" style="display: none;">
                    <label for="colorPicker">Color</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="color" id="colorPicker" onchange="updateCountryColor()">
                        <button onclick="resetCountryColor()" style="background: #95a5a6; flex: 1;">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Accommodation Section -->
            <div class="section">
                <h3>🏨 Accommodations <span id="hdrAccommodationsCount" class="count-pill">0</span></h3>
                <div class="input-group">
                    <label for="accommodationCountry">Country</label>
                    <select id="accommodationCountry">
                        <option value="">Select a country...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="accommodationCity">City/Location</label>
                    <input type="text" id="accommodationCity" placeholder="e.g., London">
                </div>
                <button onclick="addAccommodation()">+ Add Accommodation</button>
            </div>

            <!-- Accommodation List -->
            <div class="section">
                <h3>📍 Your Stays</h3>
                <div class="accommodation-list" id="accommodationList"></div>
            </div>

            <!-- Visited Places Section -->
            <div class="section">
                <h3>🏙️ Visited Places</h3>
                <div class="input-group">
                    <label for="visitedAccommodation">From Accommodation</label>
                    <select id="visitedAccommodation">
                        <option value="">Select an accommodation...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="visitedCity">Place Name</label>
                    <input type="text" id="visitedCity" placeholder="e.g., Oxford">
                </div>
                <button onclick="addVisitedCity()">+ Add Visited Place</button>
            </div>

            <!-- Visited Places List -->
            <div class="section">
                <h3>📍 Your Visited Places</h3>
                <div class="accommodation-list" id="visitedPlacesList"></div>
            </div>

            <!-- Clear All -->
            <button class="btn-secondary" onclick="clearAll()" style="margin-top: auto;">Clear All</button>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="exportData()" style="flex: 1; background: #27ae60;">💾 Export</button>
                <button onclick="importData()" style="flex: 1; background: #3498db;">📥 Import</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="handleFileImport()">
        </div>

        <!-- Map Container -->
        <div class="map-container" id="mapContainer">
            <button type="button" id="mapFullscreenToggle" class="map-fullscreen-toggle" onclick="toggleMapFullscreen()" title="Fullscreen map" aria-label="Toggle map fullscreen" aria-pressed="false">
                <i class="fa-solid fa-expand"></i>
            </button>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-defaulticon-compatibility@0.1.1/leaflet-defaulticon-compatibility.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-defaulticon-compatibility@0.1.1/leaflet-defaulticon-compatibility.css" />
    
    <!-- Coordinate Editor Modal -->
    <div id="coordinateModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeCoordinateModal()">&times;</span>
            <h3>Edit Coordinates</h3>
            <div class="input-group">
                <label for="editLat">Latitude</label>
                <input type="number" id="editLat" step="0.0001" placeholder="e.g., 51.5074">
            </div>
            <div class="input-group">
                <label for="editLon">Longitude</label>
                <input type="number" id="editLon" step="0.0001" placeholder="e.g., -0.1278">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeCoordinateModal()">Cancel</button>
                <button onclick="saveCoordinates()" style="background: #27ae60;">Save</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
